<!DOCTYPE html>
<html lang="zh-CN" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 - 星落之城</title>
<link rel="stylesheet" href="css/style.css">
<style>
html,body{overflow:auto;height:auto}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none}
.container{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.head{text-align:center;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border-color)}
.book{font-size:14px;color:var(--text-muted);margin-bottom:8px}
.title{font-size:30px;font-weight:700;color:var(--text-primary)}
.content{font-size:18px;line-height:2;letter-spacing:.5px;color:var(--text-primary)}
.content h1{font-size:26px;margin:32px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--border-color);color:var(--text-primary)}
.content h2{font-size:22px;margin:26px 0 14px;color:var(--text-primary)}
.content h3{font-size:19px;margin:22px 0 12px;color:var(--text-primary)}
.content p{margin:14px 0}
.content strong{color:var(--strong-color);font-weight:700}
.content em{color:var(--em-color)}
.content blockquote{border-left:4px solid var(--accent);padding:12px 20px;margin:18px 0;background:var(--bg-card);border-radius:0 4px 4px 0;color:var(--text-secondary);font-style:italic}
.content ul,.content ol{margin:14px 0;padding-left:32px}
.content li{margin:6px 0;line-height:1.8}
.content hr{border:none;border-top:1px solid var(--border-color);margin:30px 0}
.content code{background:var(--bg-card);padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-size:15px;color:var(--code-color)}
.content pre{background:var(--bg-card);padding:18px 24px;border-radius:4px;overflow-x:auto;margin:18px 0;border:1px solid var(--border-color)}
.content pre code{background:none;padding:0;color:inherit}
.content a{color:var(--accent)}
.content table{width:100%;border-collapse:collapse;margin:14px 0}
.content th,.content td{padding:10px 14px;border:1px solid var(--border-color);text-align:left}
.content th{background:var(--bg-card);font-weight:600}
.content img{max-width:100%;border-radius:4px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--border-color)}
.nav a{color:var(--accent);text-decoration:none;font-size:15px;padding:10px 20px;border-radius:4px;background:var(--bg-card);border:1px solid var(--border-color);transition:all .25s ease}
.nav a:hover{background:var(--bg-hover)}
.nav a.disabled{color:var(--text-muted);pointer-events:none;opacity:.5}
.toc-panel{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:var(--bg-secondary);border-left:1px solid var(--border-color);padding:20px;overflow-y:auto;transition:right .3s ease;z-index:200}
.toc-panel.open{right:0}
.toc-panel h3{font-size:15px;margin-bottom:12px;color:var(--text-primary)}
.toc-panel .toc-item{display:block;padding:8px 10px;border-radius:4px;color:var(--text-secondary);text-decoration:none;font-size:14px;transition:all .2s}
.toc-panel .toc-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.toc-panel .toc-item.active{background:var(--bg-tertiary);color:var(--accent);border-left:3px solid var(--accent)}
.fab{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:var(--shadow);z-index:150;transition:all .25s ease}
.fab:hover{transform:scale(1.1)}
.empty{text-align:center;color:var(--text-muted);padding:80px 20px;font-size:16px}
@media(max-width:768px){
.container{padding:24px 16px 60px}
.title{font-size:24px}
.content{font-size:16px}
.toc-panel{width:240px}
}
</style>
</head>
<body>
<div class="topbar">
<a class="brand" href="reader.html">📖 星落之城</a>
<div class="theme-switch">
<button class="theme-btn" data-theme="dark" title="暗夜">🌙</button>
<button class="theme-btn active" data-theme="green" title="护眼绿">🌿</button>
<button class="theme-btn" data-theme="paper" title="纸墨">📄</button>
</div>
</div>
<div class="container">
<div class="head">
<div class="book" id="bookTitle"></div>
<div class="title" id="chapterTitle">加载中...</div>
</div>
<div class="content" id="content"><div class="empty">正在加载内容...</div></div>
<div class="nav">
<a href="#" id="prevBtn" class="disabled">← 上一章</a>
<a href="#" id="nextBtn" class="disabled">下一章 →</a>
</div>
</div>
<button class="fab" id="tocFab" title="目录">☰</button>
<div class="toc-panel" id="tocPanel">
<h3>📖 目录</h3>
<div id="tocList"></div>
</div>
<script src="data/novel.js?v=20260726-2"></script>
<script src="js/reader.js"></script>
</body>
</html>
